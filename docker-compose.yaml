services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      # Agent Zero bridge: increased timeouts to prevent drops during long tool chains
      - 'AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT:-300}'
      - 'AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT=${AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT:-0}'
      - 'WEBSOCKET_SERVER_PING_TIMEOUT=${WEBSOCKET_SERVER_PING_TIMEOUT:-60}'
      # SHKeeper payment gateway
      - 'SHKEEPER_API_URL=http://host.docker.internal:5555'
      - 'SHKEEPER_API_KEY=${SHKEEPER_API_KEY}'
      - 'SHKEEPER_WEBHOOK_SECRET=${SHKEEPER_WEBHOOK_SECRET}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
